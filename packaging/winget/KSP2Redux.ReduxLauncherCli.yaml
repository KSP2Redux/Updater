---
PackageIdentifier: KSP2Redux.ReduxLauncherCli
PackageVersion: "{VERSION}"
PackageLocale: en-US
Publisher: KSP2 Redux
PublisherUrl: https://github.com/KSP2Redux
PublisherSupportUrl: https://github.com/KSP2Redux/Updater/issues
PackageName: KSP2 Redux Launcher CLI
PackageUrl: https://github.com/KSP2Redux/Updater
License: MIT
LicenseUrl: https://github.com/KSP2Redux/Updater/blob/main/LICENSE.md
ShortDescription: Scriptable front end over the KSP2 Redux launcher.
Description: >-
  Lists release channels and published versions, installs a specific Redux build into a KSP2
  install, manages the installs the launcher knows about, and starts the game. Reads and writes the
  same configuration as the KSP2 Redux launcher window.
Moniker: redux-launcher-cli
Tags:
  - ksp2
  - kerbal-space-program-2
  - modding
  - redux
  - game
ReleaseNotesUrl: https://github.com/KSP2Redux/Updater/releases/tag/cli-v{VERSION}
