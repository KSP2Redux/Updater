# Template for the winget manifest. {VERSION} and {SHA256} are filled in per release, see README.md.
# The three winget manifest files are kept together here rather than split the way winget-pkgs
# stores them, because this is the source they are generated from rather than the submission itself.
PackageIdentifier: KSP2Redux.ReduxLauncherCli
PackageVersion: "{VERSION}"
DefaultLocale: en-US
ManifestType: version
