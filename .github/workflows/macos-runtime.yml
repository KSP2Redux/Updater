# Wine takes about an hour to compile here, so the result is cached on the build script's hash. That
# is safe because build-runtime.sh pins every source by version and checksum.
name: macOS runtime

on:
    workflow_call:
    workflow_dispatch:
    pull_request:
        paths:
            - 'packaging/macos/build-runtime.sh'
            - '.github/workflows/macos-runtime.yml'
    push:
        branches: [ "main" ]
        paths:
            - 'packaging/macos/build-runtime.sh'
            - '.github/workflows/macos-runtime.yml'

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    runtime:
        runs-on: macos-15
        timeout-minutes: 150

        steps:
            -   uses: actions/checkout@v7

            -   name: Restore the runtime from cache
                id: cache
                uses: actions/cache@v6
                with:
                    path: artifacts/macos/redux-mac-runtime.tar.xz
                    key: redux-mac-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packaging/macos/build-runtime.sh') }}

            # The x86_64 Wine build needs Rosetta, which the hosted images do not always include.
            -   name: Make sure Rosetta is installed
                if: steps.cache.outputs.cache-hit != 'true'
                run: arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license

            -   name: Build the runtime
                if: steps.cache.outputs.cache-hit != 'true'
                run: packaging/macos/build-runtime.sh --install-deps --jobs "$(sysctl -n hw.ncpu)"

            -   name: Upload the build logs
                if: failure()
                uses: actions/upload-artifact@v7
                with:
                    name: redux-mac-runtime-logs
                    path: artifacts/macos/runtime-build/*.log
                    if-no-files-found: ignore

            -   name: Upload the runtime
                uses: actions/upload-artifact@v7
                with:
                    name: redux-mac-runtime
                    path: artifacts/macos/redux-mac-runtime.tar.xz
                    if-no-files-found: error
                    # Already compressed as .tar.xz.
                    compression-level: 0
