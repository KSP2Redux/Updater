# Builds the solution and runs the test suite.
name: .NET

on:
    push:
        branches: [ "main" ]
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        
        steps:
            -   uses: actions/checkout@v7
            -   name: Setup .NET
                uses: actions/setup-dotnet@v6
                with:
                    dotnet-version: 10.0.x
            -   name: Restore dependencies
                run: dotnet restore
            -   name: Build
                run: dotnet build --no-restore
            -   name: Test
                run: dotnet test --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx" --results-directory TestResults
            -   name: Upload test results
                uses: actions/upload-artifact@v7
                if: always()
                with:
                    name: test-results
                    path: TestResults/
            -   name: Report Test Results
                uses: dorny/test-reporter@v3
                if: always()
                with:
                    name: Tests
                    path: TestResults/**/*.trx
                    reporter: dotnet-trx

            # A plain build says nothing about whether the shipped binary works. The CLI is published
            # self-contained and single file, which is where an embedded resource or a trimmed away
            # dependency breaks, so the release shape is built and run here rather than at release time.
            -   name: Publish the CLI the way it ships
                run: dotnet publish src/Ksp2Redux.Tools.Cli/Ksp2Redux.Tools.Cli.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o ./publish/cli

            -   name: Smoke test the published CLI
                run: |
                    ./publish/cli/redux-launcher-cli --version
                    ./publish/cli/redux-launcher-cli --help
                    ./publish/cli/redux-launcher-cli complete -- "word:inst"
                    # No command means usage, which is exit code 1 rather than a crash.
                    ./publish/cli/redux-launcher-cli && exit 1 || test $? -eq 1
